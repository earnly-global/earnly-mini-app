name: Update Earnly opportunities
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earnly-opportunity-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and assess opportunities
        run: python scripts/update_opportunities.py
      - name: Commit updated catalog, archive and report
        run: |
          git add opportunities.json opportunities-archive.json opportunities-report.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Earnly opportunity catalog v3'
            git push
          else
            echo 'No catalog changes.'
          fi
