
name: Update Earnly opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: earnly-opportunity-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update opportunity catalog
        run: python scripts/update_opportunities.py

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunities.json opportunities-archive.json opportunities-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated Earnly opportunity update"
            git push
          fi
