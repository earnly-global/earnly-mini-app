name: Update Earnly opportunities
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earnly-opportunity-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and update opportunities
        run: python scripts/update_opportunities.py
      - name: Commit catalog if changed
        run: |
          if ! git diff --quiet -- opportunities.json; then
            git config user.name 'earnly-catalog-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add opportunities.json
            git commit -m 'Update discovered earning opportunities'
            git push
          else
            echo 'No catalog changes.'
          fi
