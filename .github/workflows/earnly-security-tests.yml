name: Earnly isolated security tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'test/**'
      - 'src/earnly-paid-access.snapshot.ts'
      - 'package.json'
      - '.github/workflows/earnly-security-tests.yml'
  pull_request:
    paths:
      - 'test/**'
      - 'src/earnly-paid-access.snapshot.ts'
      - 'package.json'
      - '.github/workflows/earnly-security-tests.yml'
jobs:
  security-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
